# Tool configuration only. The bot is not packaged; it runs from src/ with
# `python -m bot.main`.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# anyio's pytest plugin is installed with httpx but unused here (async tests
# run on pytest-asyncio); disabling it avoids its pytest deprecation warnings.
addopts = "-ra -p no:anyio"
filterwarnings = [
    # discord.py imports stdlib audioop on 3.12 and depends on audioop-lts
    # for 3.13+, so this is handled upstream and needs no action here.
    "ignore:'audioop' is deprecated:DeprecationWarning:discord.player",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
# Ruff's default rules plus import sorting.
extend-select = ["I"]
# The WSL mount marks every file executable; git stores them as 644, so the
# shebang check only produces noise locally.
ignore = ["EXE002"]
